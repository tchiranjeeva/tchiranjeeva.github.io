title: Thivanka Chiranjeeva
description: Taking hardware from concept to production - Embedded systems, PCB design, and product development.
author:
  name: Thivanka Chiranjeeva
  email: chiranjeeva8@gmail.com

# Pages shown in the Projects-section nav bar (the minima side).
# Only pages listed here (that also have a `title` in front matter) appear.
minima:
  skin: classic
  nav_pages:
    - index.md
  date_format: "%b %Y"
  show_excerpts: true
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/tchiranjeeva"
    - title: LinkedIn
      icon: linkedin
      url: "https://linkedin.com/in/thivankachiranjeeva"
  hide_site_feed_link: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 10
paginate_path: "/projects/page:num/"

sass:
  quiet_deps: true
  silence_deprecations: [import]

markdown: kramdown
